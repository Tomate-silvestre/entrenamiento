<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyecto RXI</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
  
 <a-scene>
   <a-scene cursor="rayOrigin: mouse">
    <a-entity camera look-controls wasd-controls
position="0 1.6 0">
<a-cursor color="#26A9CB"></a-cursor>
</a-entity>
<a-box position="-1 0.5 -3" color="#212220"
animation__click="property: rotation;
from: 0 0 0; to: 0 360 0;
dur: 1000; startEvents: click">
</a-box>
  

     <a-assets>
     <a-asset-item id="silla"
   src="activos/silla.glb">
     </a-asset-item>
    </a-assets>
    <a-entity gltf-model="#silla"
     position="0 1 -2"
     scale="1 1 1"></a-entity>
      <a-box position="0 0 0" color="#26A9CB">
        animation__enter="property: scale; to: 1.2 1.2 1.2;
dur: 200; startEvents: mouseenter"
animation__leave="property: scale; to: 1 1 1;
dur: 200; startEvents: mouseleave"
      </a-box>
      <a-sphere position="0 1 -8" radius="1"></a-sphere>
      <a-plane rotation="-90 0 0" width="8" height="8"></a-plane>
      <a-sky color="#222D62"></a-sky>

   
    </a-scene>

  </body>
</html>
