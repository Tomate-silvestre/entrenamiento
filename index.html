<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>La estación de la infancia</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <script>
    // Textura de cartón corrugado, teñida con el color de cada objeto.
    AFRAME.registerComponent("carton", {
      schema: {
        color: {default: "#d9aa71"},
        ondas: {default: 4}
      },
      init: function () {
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 128;
        const ctx = canvas.getContext("2d");

        for (let x = 0; x < 128; x++) {
          const tono = Math.round(215 + 35 * Math.sin(x * Math.PI / 8));
          ctx.fillStyle = `rgb(${tono},${tono},${tono})`;
          ctx.fillRect(x, 0, 1, 128);
        }

        const textura = new THREE.CanvasTexture(canvas);
        textura.wrapS = textura.wrapT = THREE.RepeatWrapping;
        textura.repeat.set(this.data.ondas / 16, 1);

        const aplicar = () => {
          const mesh = this.el.getObject3D("mesh");
          if (!mesh) return;

          mesh.material = new THREE.MeshStandardMaterial({
            color: this.data.color,
            map: textura,
            bumpMap: textura,
            bumpScale: 0.035,
            roughness: 1
          });
        };

        this.el.addEventListener("object3dset", aplicar);
        aplicar();
      }
    });

    // Flores e insectos distribuidos alrededor de la estación.
    AFRAME.registerComponent("campo", {
      init: function () {
        const crear = (tipo, atributos, padre = this.el) => {
          const objeto = document.createElement(tipo);
          Object.entries(atributos).forEach(([k, v]) =>
            objeto.setAttribute(k, v)
          );
          padre.appendChild(objeto);
          return objeto;
        };

        const colores = ["#ff7798", "#ffd65a", "#ba8ce8", "#ff9854"];

        for (let i = 0; i < 44; i++) {
          const x = Math.sin(i * 2.4) * 13;
          const z = -2 - (i % 11) * 1.6;

          // Dejar libres las vías y el edificio.
          if (Math.abs(z + 6) < 1.6) continue;
          if (Math.abs(x) < 3.5 && z < -8 && z > -13) continue;

          const flor = crear("a-entity", {position: `${x} 0 ${z}`});

          crear("a-box", {
            position: "0 0.3 1",
            width: 0.045, height: 0.6, depth: 0.04,
            carton: "color: #438b51"
          }, flor);

          for (let p = 0; p < 5; p++) {
            const angulo = p * Math.PI * 2 / 5;
            crear("a-sphere", {
              position: `${Math.cos(angulo) * 0.13}
                         ${0.65 + Math.sin(angulo) * 0.13} 0`,
              radius: 0.11,
              scale: "1 1 0.25",
              carton: `color: ${colores[i % colores.length]}`
            }, flor);
          }

          crear("a-sphere", {
            position: "0 0.65 0.04",
            radius: 0.08,
            carton: "color: #ffe780"
          }, flor);
        }

        for (let i = 0; i < 7; i++) {
          const x = -6 + i * 2;
          const z = -3 - i % 3;
          const insecto = crear("a-entity", {
            position: `${x} 1.2 ${z}`,
            animation: `property: position;
              to: ${x + 0.6} 1.7 ${z};
              dur: ${1800 + i * 170};
              dir: alternate; loop: true; easing: easeInOutSine`
          });

          crear("a-sphere", {
            radius: 0.09,
            scale: "0.7 1 1.5",
            carton: "color: #e9b347"
          }, insecto);

          [-1, 1].forEach(lado => {
            crear("a-sphere", {
              position: `${lado * 0.12} 0.04 0`,
              radius: 0.13,
              scale: "1 0.15 0.7",
              carton: "color: #ffe6b5"
            }, insecto);
          });
        }
      }
    });
  </script>
</head>

<body>
  <a-scene background="color: #b9deec">
    <a-light type="ambient" intensity="1.3" color="#fff1d9"></a-light>
    <a-light type="directional" position="-4 8 5"
             intensity="2" color="#ffe3b0"></a-light>

    <!-- Campo -->
    <a-box position="0 -0.15 -8"
           width="40" height="0.3" depth="36"
           carton="color: #91b96b; ondas: 80"></a-box>
    <a-entity campo></a-entity>

    <!-- Montañas de cartón -->
    <a-cone position="-9 4 -20"
            radius-bottom="6" radius-top="0" height="8"
            segments-radial="3"
            carton="color: #899db4"></a-cone>
    <a-cone position="0 5 -23"
            radius-bottom="7" radius-top="0" height="10"
            segments-radial="3"
            carton="color: #a69ab9"></a-cone>
    <a-cone position="10 3.5 -20"
            radius-bottom="6" radius-top="0" height="7"
            segments-radial="3"
            carton="color: #7ba69a"></a-cone>

    <!-- Estación -->
    <a-entity position="0 0 -10">
      <a-box position="0 0.2 0" width="7" height="0.4" depth="4"
             carton="color: #cfaa77"></a-box>
      <a-box position="0 1.7 0" width="5" height="3" depth="2"
             carton="color: #f4c771"></a-box>

      <a-box position="-1.35 3.4 0" rotation="0 0 22"
             width="2.9" height="0.18" depth="3"
             carton="color: #ca715e"></a-box>
      <a-box position="1.35 3.4 0" rotation="0 0 -22"
             width="2.9" height="0.18" depth="3"
             carton="color: #ca715e"></a-box>

      <a-box position="0 1.2 1.03" width="0.85" height="2" depth="0.08"
             carton="color: #73a8a4"></a-box>
      <a-box position="-1.5 1.9 1.04" width="0.85" height="0.85" depth="0.08"
             carton="color: #b9dce2"></a-box>
      <a-box position="1.5 1.9 1.04" width="0.85" height="0.85" depth="0.08"
             carton="color: #b9dce2"></a-box>

      <a-box position="0 2.85 1.1" width="4.6" height="0.5" depth="0.1"
             carton="color: #fff0cd"></a-box>
      <a-text value="La estación de la infancia"
              font="https://cdn.aframe.io/fonts/mozillavr.fnt"
              position="0 2.85 1.17" align="center"
              width="4.4" color="#664638"></a-text>
    </a-entity>

    <!-- Vías -->
    <a-box position="0 0.07 -5.4" width="32" height="0.12" depth="0.12"
           carton="color: #867467"></a-box>
    <a-box position="0 0.07 -6.6" width="32" height="0.12" depth="0.12"
           carton="color: #867467"></a-box>

    <!-- Locomotora: llega desde la izquierda y se detiene -->
    <a-entity position="-14 0 -6"
              animation="property: position; to: 0 0 -6;
                         dur: 12000; easing: easeOutCubic">
      <a-box position="0 0.55 0" width="3.8" height="0.3" depth="1.4"
             carton="color: #be6655"></a-box>

      <a-cylinder position="0.65 1.25 0" rotation="0 0 90"
                  radius="0.6" height="2"
                  carton="color: #72aaa5"></a-cylinder>

      <a-box position="-1.15 1.45 0" width="1.2" height="1.6" depth="1.3"
             carton="color: #e8b852"></a-box>
      <a-box position="-1.15 2.3 0" width="1.5" height="0.15" depth="1.6"
             carton="color: #c66d5e"></a-box>
      <a-box position="-1.15 1.8 0.67" width="0.65" height="0.65" depth="0.04"
             carton="color: #b9e0df"></a-box>

      <a-cylinder position="1.15 2 0" radius="0.18" height="0.85"
                  carton="color: #b57c62"></a-cylinder>
      <a-cylinder position="1.15 2.45 0" radius="0.3" height="0.15"
                  carton="color: #b57c62"></a-cylinder>

      <a-cylinder position="-1.1 0.4 0.73" rotation="90 0 0"
                  radius="0.4" height="0.18"
                  carton="color: #655e76"></a-cylinder>
      <a-cylinder position="1.1 0.4 0.73" rotation="90 0 0"
                  radius="0.4" height="0.18"
                  carton="color: #655e76"></a-cylinder>
      <a-cylinder position="-1.1 0.4 -0.73" rotation="90 0 0"
                  radius="0.4" height="0.18"
                  carton="color: #655e76"></a-cylinder>
      <a-cylinder position="1.1 0.4 -0.73" rotation="90 0 0"
                  radius="0.4" height="0.18"
                  carton="color: #655e76"></a-cylinder>
    </a-entity>

    <!-- Ratón para mirar; WASD para desplazarse -->
    <a-entity position="0 2.3 7">
      <a-camera></a-camera>
    </a-entity>
  </a-scene>
</body>
</html>
